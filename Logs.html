<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs - Activity Monitor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #3498db;
            --dark: #2d3436;
            --light: #f8f9fa;
            --border: #e9ecef;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .title {
            font-size: 2rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .title i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-input, .filter-select {
            padding: 0.8rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            min-width: 180px;
        }

        .filter-input:focus, .filter-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }

        .export-btn {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, var(--success), #27ae60);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }

        .logs-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1.2rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            font-weight: 600;
            color: var(--dark);
            cursor: pointer;
            user-select: none;
            transition: background 0.3s ease;
        }

        th:hover {
            background: linear-gradient(135deg, #e9ecef, #dee2e6);
        }

        th i {
            margin-left: 0.5rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .action-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-login { 
            background: linear-gradient(135deg, var(--info), #2980b9);
        }
        .action-create { 
            background: linear-gradient(135deg, var(--success), #27ae60);
        }
        .action-update { 
            background: linear-gradient(135deg, var(--warning), #e67e22);
        }
        .action-delete { 
            background: linear-gradient(135deg, var(--danger), #c0392b);
        }

        .timestamp {
            color: #666;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-success { background: var(--success); }
        .status-error { background: var(--danger); }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-info {
            color: #666;
            font-weight: 500;
        }

        .page-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 0.6rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .page-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .filters {
                flex-direction: column;
            }

            .filter-input, .filter-select {
                width: 100%;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 0.8rem;
            }
        }

        .refresh-btn {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
        }

        .stat-icon.login { background: linear-gradient(135deg, var(--info), #2980b9); }
        .stat-icon.create { background: linear-gradient(135deg, var(--success), #27ae60); }
        .stat-icon.update { background: linear-gradient(135deg, var(--warning), #e67e22); }
        .stat-icon.delete { background: linear-gradient(135deg, var(--danger), #c0392b); }

        .stat-content h3 {
            font-size: 2rem;
            color: var(--dark);
            margin-bottom: 0.3rem;
        }

        .stat-content p {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Statistics Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon login">
                    <i class="fas fa-sign-in-alt"></i>
                </div>
                <div class="stat-content">
                    <h3 id="loginCount">0</h3>
                    <p>Login Events</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon create">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div class="stat-content">
                    <h3 id="createCount">0</h3>
                    <p>Create Events</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon update">
                    <i class="fas fa-edit"></i>
                </div>
                <div class="stat-content">
                    <h3 id="updateCount">0</h3>
                    <p>Update Events</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon delete">
                    <i class="fas fa-trash"></i>
                </div>
                <div class="stat-content">
                    <h3 id="deleteCount">0</h3>
                    <p>Delete Events</p>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <h1 class="title">
                <i class="fas fa-history"></i>
                System Activity Logs
            </h1>
            <div class="filters">
                <input type="text" class="filter-input" placeholder="🔍 Search by user..." id="userFilter">
                <select class="filter-select" id="actionFilter">
                    <option value="">All Actions</option>
                    <option value="login">Login</option>
                    <option value="create">Create</option>
                    <option value="update">Update</option>
                    <option value="delete">Delete</option>
                </select>
                <input type="date" class="filter-input" id="dateFilter">
                <button class="refresh-btn" onclick="fetchLogs()">
                    <i class="fas fa-sync-alt"></i>
                    Refresh
                </button>
                <button class="export-btn" onclick="exportLogs()">
                    <i class="fas fa-download"></i>
                    Export CSV
                </button>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="logs-container">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortTable('timestamp')">
                                <i class="far fa-clock"></i> Timestamp
                                <i class="fas fa-sort"></i>
                            </th>
                            <th onclick="sortTable('user')">
                                <i class="far fa-user"></i> User
                                <i class="fas fa-sort"></i>
                            </th>
                            <th onclick="sortTable('action')">
                                <i class="fas fa-bolt"></i> Action
                                <i class="fas fa-sort"></i>
                            </th>
                            <th onclick="sortTable('details')">
                                <i class="fas fa-info-circle"></i> Details
                                <i class="fas fa-sort"></i>
                            </th>
                            <th onclick="sortTable('status')">
                                <i class="fas fa-check-circle"></i> Status
                                <i class="fas fa-sort"></i>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="5" class="loading">
                                <i class="fas fa-spinner"></i>
                                <p>Loading logs...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <div class="page-info">
                    Showing <strong><span id="startRecord">0</span></strong> to <strong><span id="endRecord">0</span></strong> of <strong><span id="totalRecords">0</span></strong> entries
                </div>
                <div class="page-buttons" id="pageButtons">
                    <!-- Pagination buttons will be generated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let logs = [];
        let filteredLogs = [];
        let currentPage = 1;
        let totalPages = 1;
        const itemsPerPage = 10;
        let currentSort = { column: 'timestamp', direction: 'desc' };

        // Fetch logs from server
        async function fetchLogs() {
            try {
                const userFilter = document.getElementById('userFilter').value;
                const actionFilter = document.getElementById('actionFilter').value;
                const dateFilter = document.getElementById('dateFilter').value;

                const params = new URLSearchParams({
                    page: currentPage,
                    limit: itemsPerPage,
                    user: userFilter,
                    action: actionFilter,
                    date: dateFilter
                });

                const response = await fetch(`get_logs.php?${params}`);
                const data = await response.json();

                if (data.success) {
                    logs = data.logs;
                    filteredLogs = logs;
                    totalPages = data.totalPages;
                    renderLogs();
                    updatePagination(data.total);
                    updateStats();
                } else {
                    showError('Failed to load logs');
                }
            } catch (error) {
                console.error('Error fetching logs:', error);
                showError('Error loading logs');
            }
        }

        // Render logs table
        function renderLogs() {
            const tbody = document.getElementById('logsTableBody');
            
            if (filteredLogs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <h3>No Logs Found</h3>
                                <p>No activity logs match your filters</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filteredLogs.map(log => `
                <tr>
                    <td class="timestamp">
                        <i class="far fa-clock"></i>
                        ${formatTimestamp(log.timestamp)}
                    </td>
                    <td>
                        <i class="far fa-user"></i>
                        ${log.user}
                    </td>
                    <td>
                        <span class="action-badge action-${log.action}">
                            <i class="fas fa-${getActionIcon(log.action)}"></i>
                            ${log.action}
                        </span>
                    </td>
                    <td>${log.details}</td>
                    <td>
                        <span class="status-indicator status-${log.status}"></span>
                        ${log.status}
                    </td>
                </tr>
            `).join('');
        }

        // Get action icon
        function getActionIcon(action) {
            const icons = {
                'login': 'sign-in-alt',
                'create': 'user-plus',
                'update': 'edit',
                'delete': 'trash'
            };
            return icons[action] || 'bolt';
        }

        // Format timestamp
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // Update statistics
        function updateStats() {
            const stats = {
                login: 0,
                create: 0,
                update: 0,
                delete: 0
            };

            logs.forEach(log => {
                if (stats.hasOwnProperty(log.action)) {
                    stats[log.action]++;
                }
            });

            document.getElementById('loginCount').textContent = stats.login;
            document.getElementById('createCount').textContent = stats.create;
            document.getElementById('updateCount').textContent = stats.update;
            document.getElementById('deleteCount').textContent = stats.delete;
        }

        // Update pagination
        function updatePagination(total) {
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, total);
            
            document.getElementById('startRecord').textContent = total > 0 ? start : 0;
            document.getElementById('endRecord').textContent = end;
            document.getElementById('totalRecords').textContent = total;

            renderPaginationButtons();
        }

        // Render pagination buttons
        function renderPaginationButtons() {
            const container = document.getElementById('pageButtons');
            let buttons = '';

            // Previous button
            buttons += `
                <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
            `;

            // Page numbers
            const maxButtons = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);

            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                buttons += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            // Next button
            buttons += `
                <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            `;

            container.innerHTML = buttons;
        }

        // Change page
        function changePage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            fetchLogs();
        }

        // Sort table
        function sortTable(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }

            filteredLogs.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];
                
                if (column === 'timestamp') {
                    aVal = new Date(aVal);
                    bVal = new Date(bVal);
                }

                if (aVal < bVal) return currentSort.direction === 'asc' ? -1 : 1;
                if (aVal > bVal) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            renderLogs();
            updateSortIcons();
        }

        // Update sort icons
        function updateSortIcons() {
            document.querySelectorAll('th i.fa-sort, th i.fa-sort-up, th i.fa-sort-down').forEach(icon => {
                icon.className = 'fas fa-sort';
            });

            const header = Array.from(document.querySelectorAll('th')).find(th => 
                th.textContent.toLowerCase().includes(currentSort.column)
            );

            if (header) {
                const icon = header.querySelector('i.fa-sort');
                if (icon) {
                    icon.className = `fas fa-sort-${currentSort.direction === 'asc' ? 'up' : 'down'}`;
                }
            }
        }

        // Export logs to CSV
        function exportLogs() {
            const csv = [
                ['Timestamp', 'User', 'Action', 'Details', 'Status'],
                ...logs.map(log => [
                    formatTimestamp(log.timestamp),
                    log.user,
                    log.action,
                    log.details.replace(/,/g, ';'),
                    log.status
                ])
            ].map(row => row.join(',')).join('\n');

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `system_logs_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Show error
        function showError(message) {
            const tbody = document.getElementById('logsTableBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="5">
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                            <h3>${message}</h3>
                        </div>
                    </td>
                </tr>
            `;
        }

        // Event listeners
        document.getElementById('userFilter').addEventListener('input', () => {
            currentPage = 1;
            fetchLogs();
        });

        document.getElementById('actionFilter').addEventListener('change', () => {
            currentPage = 1;
            fetchLogs();
        });

        document.getElementById('dateFilter').addEventListener('change', () => {
            currentPage = 1;
            fetchLogs();
        });

        // Auto-refresh every 30 seconds
        setInterval(fetchLogs, 30000);

        // Initial load
        fetchLogs();
        function deleteUser(userId) {
    fetch('delete_user.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ id: userId })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert('User deleted successfully');
            // تحديث الجدول أو إزالة الصف
        } else {
            alert('Error: ' + data.message);
        }
    });
}

    </script>
</body>
</html>
