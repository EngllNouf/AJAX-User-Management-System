<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"> <!-- This link is for the icons used on the page -->
    <link rel="stylesheet" href="frontend/style.css">
    <style>
       
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Please enter your credentials to continue</p>
            </div>
          <!-- Error alert: shows error messages to the user -->
            <div class="alert alert-error" id="errorAlert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage"></span>
            </div>
            <!-- Success alert: shows success messages to the user -->
            <div class="alert alert-success" id="successAlert">
                <i class="fas fa-check-circle"></i>
                <span id="successMessage"></span>
            </div>
          

            <form id="loginForm" novalidate>
                <div class="input-group" id="usernameGroup">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <div class="input-wrapper">
                        <i class="input-icon fas fa-user"></i>
                        
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                            minlength="3"
                        >
                    </div>
                    <div class="input-error">Username must be at least 3 characters</div>
                </div>

                <div class="input-group" id="passwordGroup">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="input-wrapper">
                        <i class="input-icon fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            minlength="6"
                        >
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="input-error">Password must be at least 6 characters</div>
                </div>

                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span>Login</span>
            
                </button>
            </form>

            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <div class="social-login">
                <button class="social-btn google" type="button">
                    <i class="fab fa-google"></i>
                    Google
                </button>
                <button class="social-btn facebook" type="button">
                    <i class="fab fa-facebook-f"></i>
                    Facebook
                </button>
            </div>

            <div class="signup-link">
                Don't have an account? <a href="#">Sign up now</a>
            </div>

            <div class="loading-overlay" id="loadingOverlay">
                <i class="fas fa-circle-notch"></i>
            </div>
        </div>
    </div>

    <script src="frontend/script.js"></script>
</body>
</html>
